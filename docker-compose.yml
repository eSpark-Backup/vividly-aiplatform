services:
  vividly_api:
    container_name: vividly-api
    image: "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    environment:
      - ENV
      - FRONTEND_BASEURL
      - JWT_SECRET
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - POSTGRES_HOST
      - POSTGRES_DB
      - POSTGRES_PORT
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_SECURE
      - SMTP_USER
      - SMTP_PASSWORD
      - SMTP_FROM_EMAIL
      - APP_NAME
      - VIVIDLY_OWNER_EMAIL
      - OPENAI_API_KEY
      - OPENAI_MODEL
      - OPENAI_MAX_TOKENS
      - OPENAI_MODEL_TEMPERATURE
      - OPENAI_IMAGE_ANALYSIS_MODEL
      - MAX_IMAGE_SIZE
      - HUMANIZER_API_URL
      - HUMANIZER_API_KEY
      - AZURE_SPEECH_REGION
      - AZURE_SPEECH_KEY
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_BUCKET
      - S3_REGION
      - S3_ENDPOINT
      - SQUARE_ACCESS_TOKEN
      - LOCATION_ID
      - PLUS_PLAN_MONTHLY_ID
      - PLUS_PLAN_ANNUALLY_ID
      - PREMIUM_PLAN_MONTHLY_ID
      - PREMIUM_PLAN_ANNUALLY_ID
      - STUDENT_PLAN_MONTHLY_ID
      - STUDENT_PLAN_ANNUALLY_ID

    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - ${DOCKER_EXPOSED_PORT_BE}:${DOCKER_APPLICATION_PORT_BE}
  


  vividly_db:
    container_name: vividly-db
    image: postgres:latest
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

    volumes:
      - vividly-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "${POSTGRES_DB}"]
      retries: 10

volumes:
  vividly-database: