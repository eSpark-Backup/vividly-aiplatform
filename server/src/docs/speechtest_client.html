<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VividlyAI - Audio Transcription</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --error-color: #ef4444;
            --success-color: #10b981;
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 24px;
        }

        h1 {
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .server-selection {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        .server-option {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .server-option.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .recorder-controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 24px 0;
        }

        button {
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .record-button {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .record-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: var(--error-color);
            display: inline-block;
        }

        .stop-icon {
            width: 16px;
            height: 16px;
            background-color: white;
            display: inline-block;
        }

        .status {
            text-align: center;
            margin: 16px 0;
            font-weight: 600;
        }

        .recording {
            color: var(--error-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .result-container {
            margin-top: 32px;
            border-top: 1px solid var(--border-color);
            padding-top: 24px;
        }

        .result-title {
            font-weight: 600;
            margin-bottom: 12px;
        }

        .transcription-result {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 16px;
            min-height: 100px;
            white-space: pre-wrap;
        }

        .error-message {
            color: var(--error-color);
            margin: 8px 0;
        }

        .success-message {
            color: var(--success-color);
            margin: 8px 0;
        }

        .audio-player {
            width: 100%;
            margin-top: 16px;
        }

        .loading {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid var(--primary-color);
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>VividlyAI Audio Transcription</h1>

    <div class="form-group">
        <label for="tokenInput">Bearer Token</label>
        <input
                type="text"
                id="tokenInput"
                placeholder="Enter your authentication token"
                required
        >
    </div>

    <div class="form-group">
        <label>Server</label>
        <div class="server-selection">
            <div class="server-option active" data-server="dev">
                Development Server
            </div>
            <div class="server-option" data-server="staging">
                Staging Server
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>Recording Format</label>
        <select id="formatSelector">
            <option value="webm">WebM (Default)</option>
            <option value="mp3">MP3</option>
            <option value="wav">WAV</option>
        </select>
    </div>

    <div class="recorder-controls">
        <button id="recordButton" class="record-button">
            <span class="record-icon"></span>
            Start Recording
        </button>
        <button id="stopButton" disabled>
            <span class="stop-icon"></span>
            Stop
        </button>
    </div>

    <div class="status" id="status"></div>

    <div id="audioContainer" style="display: none;">
        <audio id="audioPlayback" controls class="audio-player"></audio>
    </div>

    <div id="loadingContainer" class="loading" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <div class="result-container">
        <div class="result-title">Transcription Result:</div>
        <div id="transcriptionResult" class="transcription-result"></div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Server selection
        const devServer = 'http://localhost:3000';
        const stagingServer = 'https://vividly-stg-api.esparkconsultants.com';
        let selectedServer = devServer;

        const serverOptions = document.querySelectorAll('.server-option');
        serverOptions.forEach(option => {
            option.addEventListener('click', function() {
                serverOptions.forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');

                if (this.dataset.server === 'dev') {
                    selectedServer = devServer;
                } else {
                    selectedServer = stagingServer;
                }
            });
        });

        // Audio recording variables
        let mediaRecorder;
        let audioChunks = [];
        let audioBlob;
        let audioUrl;
        let recordingFormat = 'webm'; // Default format

        const recordButton = document.getElementById('recordButton');
        const stopButton = document.getElementById('stopButton');
        const status = document.getElementById('status');
        const audioPlayback = document.getElementById('audioPlayback');
        const audioContainer = document.getElementById('audioContainer');
        const transcriptionResult = document.getElementById('transcriptionResult');
        const loadingContainer = document.getElementById('loadingContainer');

        // Start recording
        recordButton.addEventListener('click', async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                // Get the selected format
                const formatSelector = document.getElementById('formatSelector');
                recordingFormat = formatSelector.value;

                // Set the appropriate MIME type based on the selected format
                let mimeType;
                switch(recordingFormat) {
                    case 'mp3':
                        mimeType = MediaRecorder.isTypeSupported('audio/mpeg')
                            ? 'audio/mpeg'
                            : 'audio/webm';
                        break;
                    case 'wav':
                        mimeType = MediaRecorder.isTypeSupported('audio/wav')
                            ? 'audio/wav'
                            : 'audio/webm';
                        break;
                    default:
                        mimeType = 'audio/webm';
                }

                mediaRecorder = new MediaRecorder(stream, { mimeType });
                audioChunks = [];

                mediaRecorder.addEventListener('dataavailable', event => {
                    audioChunks.push(event.data);
                });

                mediaRecorder.addEventListener('stop', () => {
                    // Use audio/mpeg mimetype if possible for better compatibility
                    audioBlob = new Blob(audioChunks, { type: mimeType });
                    audioUrl = URL.createObjectURL(audioBlob);
                    audioPlayback.src = audioUrl;
                    audioContainer.style.display = 'block';

                    status.textContent = 'Recording stopped';
                    status.classList.remove('recording');
                });

                mediaRecorder.start();

                recordButton.disabled = true;
                stopButton.disabled = false;

                status.textContent = 'Recording...';
                status.classList.add('recording');

                transcriptionResult.textContent = '';

            } catch (err) {
                console.error('Error accessing microphone:', err);
                status.textContent = 'Error: ' + err.message;
                status.classList.add('error-message');
            }
        });

        // Stop recording
        stopButton.addEventListener('click', function() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();

                // Stop all audio tracks
                mediaRecorder.stream.getTracks().forEach(track => track.stop());

                recordButton.disabled = false;
                stopButton.disabled = true;
            }
        });

        // Add manual transcribe button
        const transcribeButton = document.createElement('button');
        transcribeButton.textContent = 'Transcribe Audio';
        transcribeButton.id = 'transcribeButton';
        transcribeButton.style.marginTop = '16px';
        audioContainer.appendChild(transcribeButton);

        // Function to handle transcription
        async function handleTranscription() {
            const token = document.getElementById('tokenInput').value;

            if (!token) {
                status.textContent = 'Please enter an authentication token';
                status.classList.add('error-message');
                return;
            }

            if (!audioBlob) {
                status.textContent = 'No recording available';
                status.classList.add('error-message');
                return;
            }

            try {
                loadingContainer.style.display = 'flex';
                status.textContent = 'Transcribing audio...';
                status.classList.remove('error-message', 'success-message');

                // Determine file extension based on the recording format
                let fileExtension;
                switch(recordingFormat) {
                    case 'mp3':
                        fileExtension = 'mp3';
                        break;
                    case 'wav':
                        fileExtension = 'wav';
                        break;
                    default:
                        fileExtension = 'webm';
                }

                // Convert the audioBlob to a File object with a proper name and extension
                const audioFile = new File([audioBlob], `recording.${fileExtension}`, {
                    type: audioBlob.type
                });

                const formData = new FormData();
                formData.append('audio', audioFile);

                const response = await fetch(`${selectedServer}/speech/transcribe`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                loadingContainer.style.display = 'none';

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Transcription failed');
                }

                const data = await response.json();

                status.textContent = 'Transcription successful!';
                status.classList.add('success-message');

                // Display the transcription result
                transcriptionResult.textContent = data.transcript;

            } catch (err) {
                console.error('Error transcribing audio:', err);
                loadingContainer.style.display = 'none';
                status.textContent = 'Error: ' + err.message;
                status.classList.add('error-message');
            }
        }

        // Listen for the transcribe button click
        document.addEventListener('click', function(e) {
            if (e.target && e.target.id === 'transcribeButton') {
                handleTranscription();
            }
        });

        // For convenience, also start transcription when audio finishes playing
        audioPlayback.addEventListener('ended', handleTranscription);
    });
</script>
</body>
</html>
