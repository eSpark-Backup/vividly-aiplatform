# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: VIVIDLY Backend Staging CICD

on:
  push:
    branches: ["be-stg"]

concurrency: ci-${{ github.repository }}-docker-pipeline

env:
  path_to_dockerfile: "server/Dockerfile"
  docker_build_dir: "."
  image_tag: "be-stg-latest"
  lifecycle_policy_file: "policy.json"
  backend_s3_bucket: "talent-terraform-bucket"
  backend_iam_role: "terraform-role"
  github_iam_role: "cicd"
  aws_account_id: "${{ secrets.AWS_ACCOUNT_ID }}"
  aws_region: "${{ secrets.AWS_REGION }}"
  backend_dynamodb_table: "talent-terraform-dynamodb"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    outputs:
      image_tag: ${{ steps.build-publish.outputs.image_tag }}
      full_image: ${{ steps.build-publish.outputs.full_image }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.aws_account_id }}:role/cicd
          aws-region: ${{ env.aws_region }}

      - name: Setup TerraForm
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: prepare ECR repo name based on the Github repository
        shell: bash
        run: |
          set -eux

          # lowercase the name
          repo="${GITHUB_REPOSITORY,,}"

          # replace / with _
          echo "ECR_REPO_NAME=${repo//\//_}" >> $GITHUB_ENV

      - name: TerraForm init
        shell: bash
        run: |
          set -eux
          terraform init -upgrade -reconfigure \
            -backend-config='skip_metadata_api_check=true' \
            -backend-config='skip_region_validation=true' \
            -backend-config='skip_credentials_validation=true' \
            -backend-config='region=${{ env.aws_region }}' \
            -backend-config='bucket=${{ env.backend_s3_bucket }}' \
            -backend-config='key=docker-ecr/terraform-${{ env.ECR_REPO_NAME }}.tfstate' \
            -backend-config='dynamodb_table=${{ env.backend_dynamodb_table }}' \
            -backend-config="assume_role={role_arn=\"arn:aws:iam::${{ env.aws_account_id }}:role/${{ env.backend_iam_role }}\"}"
        working-directory: ${{ github.action_path }}

      - name: Create ECR repo [TerraForm apply]
        shell: bash
        run: |
          set -eux
          terraform apply \
            -var 'repository_name=${{ env.ECR_REPO_NAME }}' \
            -var 'lifecycle_policy=${{ env.lifecycle_policy_file }}' \
            -var 'iam_role=arn:aws:iam::${{ env.aws_account_id }}:role/${{ env.github_iam_role }}' \
            -var 'aws_account_id=${{ env.aws_account_id }}' \
            -auto-approve
        working-directory: ${{ github.action_path }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ env.aws_account_id }}
          mask-password: "true" # see: https://github.com/aws-actions/amazon-ecr-login#docker-credentials

      - name: Create .env File
        run: |
          touch .env
          echo "ENV=${{ secrets.STG_ENV }}" >> .env
          echo "DOCKER_EXPOSED_PORT_BE=${{ secrets.STG_DOCKER_EXPOSED_PORT_BE }}" >> .env
          echo "DOCKER_APPLICATION_PORT_BE=${{ secrets.DOCKER_APPLICATION_PORT_BE }}" >> .env
          echo "FRONTEND_BASEURL=${{ secrets.STG_FRONTEND_BASEURL }}" >> .env
          echo "LOG_LEVEL=${{ secrets.STG_LOG_LEVEL }}" >> .env
          echo "JWT_SECRET=${{ secrets.STG_JWT_SECRET }}" >> .env
          echo "POSTGRES_HOST: ${{ secrets.STG_POSTGRES_HOST }}" >> .env
          echo "POSTGRES_DB: ${{ secrets.STG_POSTGRES_DB }}" >> .env
          echo "POSTGRES_PORT: ${{ secrets.STG_POSTGRES_PORT }}" >> .env
          echo "POSTGRES_USER: ${{ secrets.STG_POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD: ${{ secrets.STG_POSTGRES_PASSWORD }}" >> .env
          echo "SMTP_HOST: ${{ secrets.STG_SMTP_HOST }}" >> .env
          echo "SMTP_PORT: ${{ secrets.STG_SMTP_PORT }}" >> .env
          echo "SMTP_SECURE: ${{ secrets.STG_SMTP_SECURE }}" >> .env        
          echo "SMTP_USER: ${{ secrets.STG_SMTP_USER }}" >> .env
          echo "SMTP_PASSWORD: ${{ secrets.STG_SMTP_PASSWORD }}" >> .env
          echo "SMTP_FROM_EMAIL: ${{ secrets.STG_SMTP_FROM_EMAIL }}" >> .env
          echo "APP_NAME: ${{ secrets.STG_APP_NAME }}" >> .env
          echo "OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}" >> .env
          echo "OPENAI_MAX_TOKENS: ${{ secrets.OPENAI_MAX_TOKENS }}" >> .env
          echo "OPENAI_MODEL_TEMPERATURE: ${{ secrets.OPENAI_MODEL_TEMPERATURE }}" >> .env
          echo "HUMANIZER_API_URL: ${{ secrets.HUMANIZER_API_URL }}" >> .env
          echo "HUMANIZER_API_KEY: ${{ secrets.HUMANIZER_API_KEY }}" >> .env
          echo "AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}" >> .env
          echo "AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}" >> .env

      - name: Build, tag, and push image to Amazon ECR
        id: build-publish
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPO_NAME }}
          IMAGE_TAG: ${{ env.image_tag }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.stg.yml build
          docker compose -f docker-compose.yml -f docker-compose.stg.yml push
          echo "IMAGE $IMAGE_TAG is pushed to $ECR_REGISTRY/$ECR_REPOSITORY"
          echo "image_tag=$IMAGE_TAG" 
          echo "full_image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  deploy:
    needs: build
    runs-on: vividly-runner

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.aws_account_id }}:role/cicd
          aws-region: ${{ env.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ env.aws_account_id }}
          mask-password: "true"

      - name: Prepare ECR repo name based on the Github repository
        shell: bash
        run: |
          set -eux
            
          # lowercase the name
          repo="${GITHUB_REPOSITORY,,}"
            
          # replace / with _
          echo "ECR_REPO_NAME=${repo//\//_}" >> $GITHUB_ENV

      - name: Pull Image from Amazon ECR and Deploy as Docker Container to EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPO_NAME }}
          IMAGE_TAG: ${{ env.image_tag }}
          ENV: ${{ secrets.STG_ENV }}
          DOCKER_EXPOSED_PORT_BE: ${{ secrets.STG_DOCKER_EXPOSED_PORT_BE }}
          DOCKER_APPLICATION_PORT_BE: ${{ secrets.DOCKER_APPLICATION_PORT_BE }}
          FRONTEND_BASEURL: ${{ secrets.STG_FRONTEND_BASEURL }}
          LOG_LEVEL: ${{ secrets.STG_LOG_LEVEL }}
          JWT_SECRET: ${{ secrets.STG_JWT_SECRET }}
          POSTGRES_HOST: ${{ secrets.STG_POSTGRES_HOST }}
          POSTGRES_DB: ${{ secrets.STG_POSTGRES_DB }}
          POSTGRES_PORT: ${{ secrets.STG_POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.STG_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.STG_POSTGRES_PASSWORD }}
          SMTP_HOST: ${{ secrets.STG_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.STG_SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.STG_SMTP_SECURE }}
          SMTP_USER: ${{ secrets.STG_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.STG_SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.STG_SMTP_FROM_EMAIL }}
          APP_NAME: ${{ secrets.STG_APP_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_MAX_TOKENS: ${{ secrets.OPENAI_MAX_TOKENS }}
          OPENAI_MODEL_TEMPERATURE: ${{ secrets.OPENAI_MODEL_TEMPERATURE }}
          HUMANIZER_API_URL: ${{ secrets.HUMANIZER_API_URL }}
          HUMANIZER_API_KEY: ${{ secrets.HUMANIZER_API_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}          

        run: |
          docker compose -f docker-compose.yml -f docker-compose.stg.yml pull
          docker compose -f docker-compose.yml -f docker-compose.stg.yml -p "vividly_stack_stg" down
          docker compose -f docker-compose.yml -f docker-compose.stg.yml -p "vividly_stack_stg" up -d
